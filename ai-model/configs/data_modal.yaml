# Modal-compatible dataset configuration for Construction-PPE
# This file maps paths to the Modal container mount point at /dataset
# Original data.yaml is preserved for local use

# Dataset root inside Modal container (mounted via modal.Mount)
path: /dataset

# Train/val/test splits (relative to path)
train: images/train   # 30148 images
val: images/val       # 143 images
test: images/test     # 141 images

# Classes (11 total)
names:
  0: helmet
  1: gloves
  2: vest
  3: boots
  4: goggles
  5: none
  6: Person
  7: no_helmet
  8: no_goggle
  9: no_gloves
  10: no_boots
